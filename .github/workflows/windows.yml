name: Windows build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - assets/**
      - build.rs
      - tools/package.ps1
  pull_request:
    paths:
      - .github/workflows/windows.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - assets/**
      - build.rs
      - tools/package.ps1
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.99.0
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Windows installer
        shell: pwsh
        run: ./tools/package.ps1
      - name: Smoke test installer
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\CarnetDeNotes-*-Setup.exe | Select-Object -First 1).FullName
          $folder = Join-Path $env:RUNNER_TEMP 'carnet-install-smoke'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$folder") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $folder 'CarnetDeNotes.exe'))) { throw 'Installed executable missing' }
          $uninstaller = (Get-ChildItem (Join-Path $folder 'unins*.exe') | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Uninstaller exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarnetDeNotes-Windows-x64
          path: dist/*
